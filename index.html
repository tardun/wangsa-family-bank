<script>
  // ===== KONFIGURASI =====
  const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxDlkn50b8YE3a-15frqfvuemgtG5lC6mwhGE4KR73s-J3tdIbvweNyCUJAA1MtlfrS/exec'; // GANTI DENGAN URL ANDA

  // ===== FUNGSI HELPER UNTUK PANGGIL GAS =====
  async function callGAS(functionName, ...args) {
    try {
      const response = await fetch(GAS_API_URL, {
        method: 'POST',
        redirect: 'follow', // PENTING: Google selalu redirect
        headers: {
          'Content-Type': 'text/plain', // Gunakan text/plain untuk hindari preflight
        },
        body: JSON.stringify({
          function: functionName,
          args: args
        })
      });
      
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      
      const result = await response.json();
      return result;
    } catch (error) {
      console.error('Gagal menghubungi server:', error);
      return { success: false, message: 'Koneksi error: ' + error.message };
    }
  }

  // ===== CHECK LOGIN STATUS =====
  async function checkLoginStatus() {
    try {
      const result = await callGAS('checkSession');
      if (result.loggedIn) {
        showMainApp(result.user);
      } else {
        showLoginPage();
      }
    } catch (error) {
      console.error('Error check session:', error);
      showLoginPage();
    }
  }

  function showLoginPage() {
    document.getElementById('loginPage').classList.remove('hidden');
    document.getElementById('mainContent').classList.add('hidden');
  }

  function showMainApp(user) {
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('mainContent').classList.remove('hidden');
    document.getElementById('userInfo').innerHTML = `
      <p class="text-lg">Halo, <strong>${user.namaLengkap}</strong>!</p>
      <p class="text-slate-500">Role: ${user.role}</p>
      <button onclick="doLogout()" class="mt-4 px-4 py-2 bg-red-600 text-white rounded-lg">Logout</button>
    `;
  }

  // ===== HANDLE LOGIN FORM =====
  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const username = document.getElementById('loginUsername').value;
    const password = document.getElementById('loginPassword').value;
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    
    loginBtn.disabled = true;
    loginBtn.innerHTML = 'Loading...';
    loginError.classList.add('hidden');
    
    try {
      const result = await callGAS('doLogin', username, password);
      
      if (result.success) {
        showMainApp(result.user);
      } else {
        loginError.textContent = '❌ ' + result.message;
        loginError.classList.remove('hidden');
      }
    } catch (error) {
      loginError.textContent = '❌ Gagal koneksi ke server';
      loginError.classList.remove('hidden');
    } finally {
      loginBtn.disabled = false;
      loginBtn.innerHTML = 'Login';
    }
  });

  // ===== LOGOUT =====
  async function doLogout() {
    await callGAS('doLogout');
    showLoginPage();
  }

  // ===== INIT =====
  checkLoginStatus();
</script>
